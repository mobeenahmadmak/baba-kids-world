</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7061dc"></head><body><div id="app"></div><script>'use strict';
const KEY='bkw-v1-progress';
const defaults=()=>({Arfa:{stars:0,completed:0,correct:0,attempted:0,good:{},deedAwards:{},history:[],messagesRead:0},Mohid:{stars:0,completed:0,correct:0,attempted:0,good:{},deedAwards:{},history:[],messagesRead:0}});
let data=load(),kid=null,view='welcome',session=null,feedback=null,locked=false;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.Arfa&&d.Mohid)return d}catch{}return defaults()}
const SNAPSHOT_KEY='bkw-progress-snapshot-v1';
const SNAPSHOT_DAY_KEY='bkw-progress-snapshot-day-v1';
function save(){
  try{
    const previous=localStorage.getItem(KEY);
    const day=new Date().toISOString().slice(0,10);
    if(previous&&localStorage.getItem(SNAPSHOT_DAY_KEY)!==day){
      try{localStorage.setItem(SNAPSHOT_KEY,previous);localStorage.setItem(SNAPSHOT_DAY_KEY,day)}catch{}
    }
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  }catch{
    alert('Progress could not be saved. Please export a backup and check device storage.');
    return false;
  }
}
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Parent PIN is only a local child-access barrier, NOT secure authentication.
const PIN_KEY='bkw-parent-pin-v4';let parentUnlocked=false;
function pinDigest(v){let h=2166136261;for(const ch of 'bkw-local-'+v){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function parentGate(target){if(parentUnlocked)return true;const saved=localStorage.getItem(PIN_KEY);if(!saved){const first=prompt('Parent setup: choose a 4–8 digit PIN. This only prevents casual changes on this device.');if(first===null)return false;if(!/^\d{4,8}$/.test(first)){alert('Use 4 to 8 digits.');return false}const repeat=prompt('Confirm the parent PIN:');if(repeat!==first){alert('PINs do not match.');return false}localStorage.setItem(PIN_KEY,pinDigest(first));parentUnlocked=true;return true}
const entry=prompt('Enter parent PIN to open '+(target==='mathbank'?'Baba’s Question Bank':'Parent Area')+':');if(entry===null)return false;if(pinDigest(entry)!==saved){alert('Incorrect PIN.');return false}parentUnlocked=true;return true}
function lockParent(){parentUnlocked=false;view='home';render()}
function changePin(){if(!parentUnlocked)return;const n=prompt('Enter a new 4–8 digit parent PIN:');if(n===null)return;if(!/^\d{4,8}$/.test(n)){alert('Use 4 to 8 digits.');return}const again=prompt('Confirm new PIN:');if(again!==n){alert('PINs do not match.');return}localStorage.setItem(PIN_KEY,pinDigest(n));alert('PIN updated on this device.')}

function header(){return `<header class="top"><div><div class="brand">🌙 Baba & Kids World</div><div class="tiny">Learn • Play • Be Kind</div></div><div class="actions">${kid?`<span class="pill">${kid==='Arfa'?'👧':'👦'} ${kid} · ⭐ ${data[kid].stars}</span><button class="btn secondary" data-action="switch">Switch</button>`:''}</div></header>`}
function nav(){return kid?`<nav class="bottom" aria-label="Main navigation">${[['home','🏡','Home'],['learn','📚','Learn'],['deeds','💚','Deeds'],['baba','💌','Baba'],['progress','🏆','Stars']].map(([id,emoji,label])=>`<button data-view="${id}" class="${view===id?'active':''}"><span class="nav-emoji">${emoji}</span>${label}</button>`).join('')}</nav>`:''}
// Android system Back navigates screens instead of closing the installed PWA.
const screenHistory=new Map();
let screenCounter=0,restoringScreen=false,lastScreenKey='';
function screenKey(){return (kid||'welcome')+':'+view}
function rememberScreen(){
  if(restoringScreen)return;
  const key=screenKey();
  if(key===lastScreenKey)return;
  lastScreenKey=key;
  const id=++screenCounter;
  screenHistory.set(id,{kid,view,session,mathSession:typeof mathSession==='undefined'?null:mathSession});
  if(screenHistory.size>150)screenHistory.delete(screenHistory.keys().next().value);
  history.pushState({bkwScreen:id},'',location.href);
}
window.addEventListener('popstate',event=>{
  const saved=screenHistory.get(event.state?.bkwScreen);
  restoringScreen=true;
  if(saved){
    kid=saved.kid;view=saved.view;session=saved.session;
    mathSession=saved.mathSession;
  }else{
    // Stay in the app at the welcome screen, including after the first Back.
    kid=null;view='welcome';session=null;mathSession=null;parentUnlocked=false;
  }
  feedback=null;locked=false;
  lastScreenKey=screenKey();
  render();
  restoringScreen=false;
  window.scrollTo(0,0);
  // At the first screen, retain a history entry so Back does not immediately exit.
  if(!saved){
    lastScreenKey='';
    rememberScreen();
  }
});

tile('game:count','🔢','Number Garden','Count and add')+tile('picturecount','🧸','Picture Counting','Count friendly pictures')+tile('game:letters','🔤','ABC Adventure','Letters and sounds')+tile('game:shapes','🎨','Colors & Shapes','Look, match and choose')}${tile('game:islam','🕌','Little Muslim Quiz','Faith and good manners')}${tile('game:memory','🧩','Memory Match','Remember and find pairs')}${kid==='Arfa'?tile('game:fractions','🍕','Fraction Kitchen','Understand halves and quarters')+tile('game:grammar','✍️','Sentence Builder','Grammar and punctuation')+tile('game:logic','🧠','Logic Lab','Patterns and reasoning'):tile('game:animals','🐾','Animal Safari','Recognize animals and sounds')+tile('game:patterns','🧩','Pattern Parade','Find what comes next')+tile('game:everyday','🧼','Little Life Skills','Healthy habits and manners')}${tile('game:arabic','🔠','Arabic Letters','Recognize Arabic letters')}${tile('game:manners','🌷','Kindness Quest','Islamic manners in daily life')}</div>`}else if(view==='mathacademy'){content=mathHome()}else if(view==='mathplay'){content=mathPlayHTML()}else if(view==='mathresult'){content=mathResultHTML()}else if(view==='mathbank'){content=mathBankHTML()}else if(view==='mathprogress'){content=mathProgressHTML()}else if(view==='game'){content=gameHTML()}else if(view==='duas'){content=duasHTML()}else if(view==='islamic'){content=islamicHTML()}else if(view==='deeds'){content=deedsHTML()}else if(view==='baba'){content=babaHTML()}else if(view==='progress'){content=progressHTML()}else if(view==='parent'){content=parentHTML()}else if(view==='result'){content=resultHTML()}else if(view==='lesson'){content=lessonHTML(session.lesson)}
$('#app').innerHTML=`<div class="app">${header()}<main>${content}</main></div>${nav()}`;bind();}

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startPictureCount(){
  if(kid!=='Mohid')return;
  const pictures=['🍎','🐻','🚗','🦋','⭐','🐱','🌼','⚽'];
  const questions=Array.from({length:5},()=>{
    const n=1+Math.floor(Math.random()*6);
    const picture=pictures[Math.floor(Math.random()*pictures.length)];
    const options=shuffled([n,...[1,2,3,4,5,6,7,8].filter(x=>x!==n).sort(()=>Math.random()-.5).slice(0,3)]);
    return {prompt:'How many do you see?',picture,count:n,answers:options.map(String),correct:options.indexOf(n),explain:'Count each picture slowly, one by one.'};
  });
  session={type:'picturecount',questions,index:0,score:0};
  view='game';feedback=null;locked=false;render();
}

async function restore(file){if(!file)return;try{if(file.size>2000000)throw Error('File too large');const o=JSON.parse(await file.text());if(o.app!=='baba-kids-world'||o.version!==1||!o.profiles?.Arfa||!o.profiles?.Mohid)throw Error('Not a valid backup');for(const name of ['Arfa','Mohid']){const p=o.profiles[name];if(!Number.isSafeInteger(p.stars)||p.stars<0||!Number.isSafeInteger(p.completed)||p.completed<0||!Array.isArray(p.history)||!p.good||typeof p.good!=='object'||!Number.isSafeInteger(p.correct)||!Number.isSafeInteger(p.attempted))throw Error('Invalid profile data')}if(!confirm('Replace both profiles on this device with this backup?'))return;const previousData=data;
const previousRaw=localStorage.getItem(KEY);
try{if(previousRaw)localStorage.setItem(SNAPSHOT_KEY,previousRaw)}catch{}
data=o.profiles;
try{localStorage.setItem(KEY,JSON.stringify(data))}catch{data=previousData;throw Error('Device storage is full or unavailable; existing progress was kept')}
alert('Backup restored successfully!');view='home';render()}catch(e){alert('Could not restore: '+e.message)}}
function recoverSnapshot(){
  if(!parentUnlocked)return;
  let snapshot;
  try{snapshot=JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'null')}catch{}
  if(!snapshot||!snapshot.Arfa||!snapshot.Mohid||!Number.isSafeInteger(snapshot.Arfa.stars)||!Number.isSafeInteger(snapshot.Mohid.stars)){
    alert('No valid local recovery snapshot is available. Use an exported backup if you have one.');
    return;
  }
  if(!confirm('Restore an earlier local snapshot for BOTH children? First export your current progress. This replaces current progress.'))return;
  const old=data;
  data=snapshot;
  // Preserve the recovery copy instead of overwriting it during restoration.
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch{data=old;alert('Recovery could not be saved; current progress was kept.');return}
  alert('Earlier local progress restored. Export a backup now.');
  view='home';render();
}

function mathRand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function mathShuffle(a){return a.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.v)}
function mathQuestion(topic,level){let x,y,ans,prompt,explain;const ranges={easy:[1,20],medium:[10,100],hard:[50,999]},[lo,hi]=ranges[level]||ranges.easy;
if(topic==='addition'){x=mathRand(lo,hi);y=mathRand(lo,hi);ans=x+y;prompt=`${x} + ${y} = ?`;explain=`Add ${x} and ${y}.`}
else if(topic==='subtraction'){x=mathRand(lo,hi);y=mathRand(lo,hi);if(y>x)[x,y]=[y,x];ans=x-y;prompt=`${x} − ${y} = ?`;explain=`Take ${y} away from ${x}.`}
else if(topic==='multiplication'){x=mathRand(2,level==='easy'?5:level==='medium'?12:25);y=mathRand(2,level==='easy'?10:level==='medium'?12:25);ans=x*y;prompt=`${x} × ${y} = ?`;explain=`${x} groups of ${y} make ${ans}.`}
else if(topic==='division'){y=mathRand(2,level==='easy'?5:level==='medium'?12:20);ans=mathRand(2,level==='easy'?10:level==='medium'?12:20);x=y*ans;prompt=`${x} ÷ ${y} = ?`;explain=`${y} × ${ans} = ${x}.`}
else if(topic==='fractions'){let den=[2,4,5,8,10][mathRand(0,level==='easy'?1:level==='medium'?3:4)];let num=mathRand(1,den-1);x=den*(level==='hard'?mathRand(3,12):level==='medium'?mathRand(2,6):mathRand(1,4));ans=x*num/den;prompt=`What is ${num}/${den} of ${x}?`;explain=`Divide ${x} by ${den}, then multiply by ${num}.`}
else if(topic==='word problems'){x=mathRand(lo,hi);y=mathRand(lo,hi);ans=x+y;prompt=`Arfa has ${x} stickers and receives ${y} more. How many stickers now?`;explain=`Add ${x} + ${y}.`}
else if(topic==='patterns'){x=mathRand(1,level==='easy'?10:100);y=mathRand(2,level==='easy'?5:level==='medium'?12:25);ans=x+3*y;prompt=`What comes next? ${x}, ${x+y}, ${x+2*y}, ...`;explain=`Each number increases by ${y}.`}
else if(topic==='time'){x=mathRand(1,12);y=mathRand(1,level==='easy'?3:level==='medium'?6:12);ans=(x+y-1)%12+1;prompt=`It is ${x}:00. What hour will it be ${y} hours later? (12-hour clock)`;explain=`Count forward ${y} hours, wrapping after 12.`}
else if(topic==='money'){x=mathRand(2,level==='easy'?20:level==='medium'?100:500);y=mathRand(1,level==='easy'?10:level==='medium'?50:200);ans=x+y;prompt=`A book costs SAR ${x} and a toy costs SAR ${y}. What is the total in riyals?`;explain=`Add both prices.`}
else {x=mathRand(2,level==='easy'?10:level==='medium'?30:100);y=mathRand(2,level==='easy'?10:level==='medium'?30:100);ans=2*(x+y);prompt=`A rectangle is ${x} cm long and ${y} cm wide. What is its perimeter in cm?`;explain=`Perimeter = 2 × (length + width).`}
return {id:'g-'+Date.now()+'-'+Math.random().toString(36).slice(2),topic,level,prompt,answer:String(ans),explain,custom:false}}
function mathOptions(answer){const n=Number(answer);if(!Number.isFinite(n))return null;let set=new Set([n]);let offsets=[1,2,3,5,10,Math.max(2,Math.round(Math.abs(n)*.1))];while(set.size<4){let d=offsets[mathRand(0,offsets.length-1)];let val=n+(Math.random()<.5?-d:d);if(val>=0)set.add(val)}return mathShuffle([...set].map(String))}
function mathTopicSummary(topic){
  const attempts=mathState().attempts.filter(a=>a.topic===topic);
  const recent=attempts.slice(-10);
  const accuracy=recent.length?Math.round(100*recent.filter(a=>a.correct).length/recent.length):null;
  const level=accuracy===null?'New':accuracy>=85&&recent.length>=5?'Mastering':accuracy>=60?'Practicing':'Needs practice';
  return {accuracy,level,attempts:attempts.length};
}
function mathSuggestedTopic(){
  const topics=MATH_TOPICS.map(topic=>({topic,...mathTopicSummary(topic)}));
  return topics.filter(x=>x.attempts>0).sort((a,b)=>(a.accuracy??100)-(b.accuracy??100))[0]?.topic||'addition';
}
function mathStats(){const a=mathState().attempts;return {total:a.length,correct:a.filter(v=>v.correct).length,wrong:a.filter(v=>!v.correct).length}}
function mathHome(){const st=mathStats(),m=mathState();return `${back()}<section class="hero"><div class="eyebrow">🏰 ARFA'S MATH ACADEMY</div><h1>Every problem is an adventure!</h1><p>Practice, learn from mistakes and collect stars. Questions change every time.</p></section><div class="stat-row"><div class="stat"><b>${st.total}</b>Answers tried</div><div class="stat"><b>${st.total?Math.round(100*st.correct/st.total):0}%</b>Accuracy</div><div class="stat"><b>${st.wrong}</b>Mistakes to review</div><div class="stat"><b>${m.custom.length}</b>Baba's questions</div></div><div class="panel"><h2>Choose your practice</h2><label for="mathTopic">Topic</label><select id="mathTopic" class="field">${MATH_TOPICS.map(t=>`<option value="${t}">${MATH_LABELS[t]}</option>`).join('')}<option value="mixed">🎲 Mixed topics</option><option value="custom">📝 Baba's questions</option></select><label for="mathLevel">Difficulty</label><select id="mathLevel" class="field"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><label for="mathCount">Questions per round</label><select id="mathCount" class="field"><option value="10">10 questions</option><option value="20">20 questions</option><option value="25">25 questions</option></select><button class="btn" data-math="start">Start practice ✨</button> <button class="btn secondary" data-math="smart">Practice my weak topic</button><p class="tiny">Suggested topic: ${escapeHTML(MATH_LABELS[mathSuggestedTopic()]||'Addition')}. Recommendations use your last 10 answers per topic.</p></div><div class="grid" style="margin-top:18px"><button class="card" data-math="daily"><span class="emoji">☀️</span><strong>Daily 10</strong><small>One new challenge each day</small></button><button class="card" data-math="review"><span class="emoji">🔁</span><strong>Review mistakes</strong><small>Try missed questions again</small></button><button class="card" data-math="bank"><span class="emoji">✍️</span><strong>Baba's Question Bank</strong><small>Add, edit and delete your own questions</small></button><button class="card" data-math="progress"><span class="emoji">📊</span><strong>My Math Progress</strong><small>Topic accuracy and recent activity</small></button></div><p class="notice" style="margin-top:18px">Progress and custom questions are saved on this device only. Use Parent Area backup to transfer them. Daily challenges follow this device's date.</p>`}
function mathStart(mode){const m=mathState(),topic=$('#mathTopic')?.value||'mixed',level=$('#mathLevel')?.value||'easy',count=Number($('#mathCount')?.value)||10;let questions=[];if(mode==='daily'){const today=new Date().toLocaleDateString('en-CA');if(m.daily[today]){alert('Today’s challenge is already completed. Come back tomorrow, or practice anytime!');return}for(let i=0;i<10;i++)questions.push(mathQuestion(MATH_TOPICS[i],['easy','medium','hard'][i%3]));}
else if(mode==='smart'){
  const selected=mathSuggestedTopic();
  const recent=m.attempts.filter(a=>a.topic===selected).slice(-10);
  const accuracy=recent.length?recent.filter(a=>a.correct).length/recent.length:0;
  const suggestedLevel=accuracy>=.85?'hard':accuracy>=.65?'medium':'easy';
  for(let i=0;i<10;i++)questions.push(mathQuestion(selected,suggestedLevel));
}
else if(mode==='review'){const wrong=m.attempts.filter(a=>!a.correct&&a.question&&a.question.prompt).slice(-100).reverse();const seen=new Set();for(const a of wrong){let q=a.question;const key=q.prompt+'|'+q.answer;if(!seen.has(key)){questions.push({...q});seen.add(key)}if(questions.length===20)break}if(!questions.length){alert('No missed questions yet. Great work!');return}}
else if(topic==='custom'){questions=mathShuffle(m.custom).slice(0,count).map(q=>({...q}));if(!questions.length){alert('Add some questions in Baba’s Question Bank first.');return}}
else for(let i=0;i<count;i++)questions.push(mathQuestion(topic==='mixed'?MATH_TOPICS[mathRand(0,MATH_TOPICS.length-1)]:topic,level));
mathSession={mode,questions,index:0,correct:0,answered:false,selected:null,started:new Date().toISOString()};view='mathplay';render()}
function mathPlayHTML(){if(!mathSession)return mathHome();const s=mathSession,q=s.questions[s.index];if(!q)return mathResultHTML();if(!s.options||s.optionIndex!==s.index){s.options=mathOptions(q.answer)||[q.answer];s.optionIndex=s.index}return `<button class="back" data-math="home">← Math Academy</button><div class="panel"><div class="actions" style="justify-content:space-between"><span class="badge">${escapeHTML(MATH_LABELS[q.topic]||q.topic)} · ${escapeHTML(q.level||'Custom')}</span><span class="pill">${s.index+1} / ${s.questions.length}</span></div><div class="progress" style="margin:18px 0"><span style="width:${Math.round(100*s.index/s.questions.length)}%"></span></div><div class="question">${escapeHTML(q.prompt)}</div><div class="choices">${s.options.map((o,i)=>`<button class="choice ${s.answered?(o===q.answer?'correct':s.selected===o?'wrong':''):''}" data-math-answer="${i}" ${s.answered?'disabled':''}>${escapeHTML(o)}</button>`).join('')}</div>${s.answered?`<div class="feedback">${s.selected===q.answer?'🌟 Correct! MashaAllah!':'💡 Keep trying! The answer is '+escapeHTML(q.answer)}</div><p class="center muted">${escapeHTML(q.explain||('Think about the steps that lead to '+q.answer+'. Try solving a similar question again.'))}</p><div class="center"><button class="btn" data-math="next">${s.index===s.questions.length-1?'See results':'Next question →'}</button></div>`:'<p class="center muted">Tap an answer to continue.</p>'}</div>`}
function mathAnswer(i){const s=mathSession;if(!s||s.answered)return;const q=s.questions[s.index],selected=s.options[i];if(selected===undefined)return;s.answered=true;s.selected=selected;const correct=selected===q.answer;if(correct)s.correct++;const m=mathState();m.attempts.push({date:new Date().toISOString(),topic:q.topic,level:q.level||'custom',correct,question:{...q},selected});if(m.attempts.length>3000)m.attempts=m.attempts.slice(-3000);save();render()}
function mathNext(){const s=mathSession;if(!s||!s.answered)return;s.index++;s.answered=false;s.selected=null;if(s.index>=s.questions.length){const m=mathState();if(s.mode==='daily'){m.daily[new Date().toLocaleDateString('en-CA')]=true}const earned=s.correct*2;data.Arfa.stars+=earned;save();view='mathresult'}render()}
function mathResultHTML(){const s=mathSession;if(!s)return mathHome();return `<div class="panel center"><div style="font-size:68px">🏆</div><h1>Wonderful effort, Arfa!</h1><h2>${s.correct} / ${s.questions.length} correct</h2><p>⭐ You earned ${s.correct*2} stars for your correct answers.</p><p class="muted">Mistakes are saved for revision.</p><button class="btn" data-math="home">Back to Math Academy</button></div>`}
function mathProgressHTML(){const m=mathState(),st=mathStats();return `<button class="back" data-math="home">← Math Academy</button><h1>📊 My Math Progress</h1><div class="stat-row"><div class="stat"><b>${st.total}</b>Attempts</div><div class="stat"><b>${st.correct}</b>Correct</div><div class="stat"><b>${st.total?Math.round(st.correct/st.total*100):0}%</b>Accuracy</div></div><div class="panel"><h2>By topic</h2>${MATH_TOPICS.map(t=>{let a=m.attempts.filter(x=>x.topic===t),c=a.filter(x=>x.correct).length,p=a.length?Math.round(c/a.length*100):0;const summary=mathTopicSummary(t);return `<div style="margin:14px 0"><div class="actions" style="justify-content:space-between"><strong>${MATH_LABELS[t]}</strong><span>${a.length} tried · ${p}% correct · ${summary.level}</span></div><div class="progress"><span style="width:${p}%"></span></div></div>`}).join('')}</div><div class="panel"><h2>Recent answers</h2>${m.attempts.slice(-12).reverse().map(a=>`<p>${a.correct?'✅':'🔁'} ${escapeHTML(a.question?.prompt||'Question')} · ${a.correct?'Correct':'Needs revision'}</p>`).join('')||'<p>No practice yet. Start a round!</p>'}</div>`}
function mathBankHTML(){if(!parentUnlocked)return '<p>Parent access required.</p>';const m=mathState();return `<button class="back" data-math="home">← Math Academy</button><h1>✍️ Baba's Question Bank</h1><p class="notice">Parent area: anyone with access to this shared device can edit questions. Do not include private information.</p><div class="panel"><h2>Add a question</h2><form id="mathBankForm"><label for="bankPrompt">Question</label><textarea id="bankPrompt" class="field" maxlength="250" required placeholder="What is 12 × 8?"></textarea><label for="bankAnswer">Correct numeric answer</label><input id="bankAnswer" class="field" type="number" step="any" min="0" max="1000000" required placeholder="96"><label for="bankExplain">Explanation (optional)</label><textarea id="bankExplain" class="field" maxlength="250" placeholder="12 groups of 8 make 96"></textarea><label for="bankTopic">Topic</label><select id="bankTopic" class="field">${MATH_TOPICS.map(t=>`<option value="${t}">${MATH_LABELS[t]}</option>`).join('')}</select><label for="bankLevel">Difficulty</label><select id="bankLevel" class="field"><option>easy</option><option>medium</option><option>hard</option></select><button class="btn" type="submit">Save question</button></form></div><div class="panel"><h2>Saved questions (${m.custom.length})</h2>${m.custom.map((q,i)=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><strong>${escapeHTML(q.prompt)}</strong><p class="muted">Answer: ${escapeHTML(q.answer)} · ${escapeHTML(q.topic)}</p><button class="btn secondary" data-math-edit="${i}">Edit</button> <button class="btn secondary" data-math-delete="${i}">Delete</button></div>`).join('')||'<p>No custom questions yet.</p>'}</div>`}
function mathSaveBank(){if(!parentUnlocked)return;const prompt=$('#bankPrompt').value.trim(),answer=$('#bankAnswer').value.trim(),explain=$('#bankExplain').value.trim(),topic=$('#bankTopic').value,level=$('#bankLevel').value;if(!prompt||!answer)return;if(!Number.isFinite(Number(answer))||Number(answer)<0){alert('Please enter a non-negative numeric answer.');return}const m=mathState();if(m.custom.length>=500){alert('Maximum 500 custom questions. Remove some first.');return}m.custom.push({id:'c-'+Date.now(),prompt,answer,explain,topic,level,custom:true});save();render()}
function bindMath(){document.querySelectorAll('[data-math]').forEach(el=>el.addEventListener('click',()=>{const a=el.dataset.math;if(a==='home'){view='mathacademy';mathSession=null;render()}else if(a==='start')mathStart('practice');else if(a==='daily')mathStart('daily');else if(a==='smart')mathStart('smart');else if(a==='review')mathStart('review');else if(a==='next')mathNext();else if(a==='bank'){if(!parentGate('mathbank'))return;view='mathbank';render()}else if(a==='progress'){view='mathprogress';render()}}));document.querySelectorAll('[data-math-answer]').forEach(el=>el.addEventListener('click',()=>mathAnswer(Number(el.dataset.mathAnswer))));$('#mathBankForm')?.addEventListener('submit',e=>{e.preventDefault();mathSaveBank()});document.querySelectorAll('[data-math-delete]').forEach(el=>el.addEventListener('click',()=>{if(!parentUnlocked)return;const i=Number(el.dataset.mathDelete);if(confirm('Delete this question?')){mathState().custom.splice(i,1);save();render()}}));document.querySelectorAll('[data-math-edit]').forEach(el=>el.addEventListener('click',()=>{if(!parentUnlocked)return;const i=Number(el.dataset.mathEdit),q=mathState().custom[i];if(!q)return;const p=prompt('Edit question:',q.prompt);if(p===null)return;const a=prompt('Correct answer:',q.answer);if(a===null)return;if(!p.trim()||!a.trim()||!Number.isFinite(Number(a))||Number(a)<0){alert('Question and a non-negative numeric answer are required.');return}q.prompt=p.trim().slice(0,250);q.answer=a.trim().slice(0,60);save();render()}))}

render();
(function setupConnectivity(){
  const indicator=document.createElement('div');
  indicator.id='baba-connectivity';
  indicator.setAttribute('role','status');
  indicator.setAttribute('aria-live','polite');
  indicator.style.cssText='display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);z-index:99998;background:#fff5d6;color:#5c4518;border:1px solid #e5c671;border-radius:999px;padding:8px 14px;box-shadow:0 3px 14px #30277022;font:600 13px system-ui,sans-serif;text-align:center;pointer-events:none;';
  indicator.textContent='Offline mode · Your saved games still work';
  document.body.appendChild(indicator);
  const refresh=()=>{indicator.style.display=navigator.onLine?'none':'block'};
  window.addEventListener('online',refresh);
  window.addEventListener('offline',refresh);
  refresh();
})();
(function setupAppUpdates(){
  if(location.protocol!=='https:'||!('serviceWorker' in navigator))return;
  let pendingWorker=null;
  let refreshing=false;
  const banner=document.createElement('aside');
  banner.id='baba-update-banner';
  banner.setAttribute('role','status');
  banner.setAttribute('aria-live','polite');
  banner.style.cssText='display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99999;max-width:560px;margin:0 auto;background:#fff;color:#292448;border:2px solid #7061dc;border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px #28205240;font:600 15px system-ui,sans-serif;';
  banner.innerHTML='<div style="font-size:17px;margin-bottom:5px">New adventures are ready!</div><div style="font-weight:400;margin-bottom:12px">Baba has updated your learning world. Your stars and progress will stay saved.</div><button id="baba-update-now" type="button" style="background:#7061dc;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700;min-height:44px;cursor:pointer">Update Now</button> <button id="baba-update-later" type="button" style="background:transparent;color:#292448;border:0;padding:12px;min-height:44px;cursor:pointer">Later</button>';
  document.body.appendChild(banner);
  const show=worker=>{if(!navigator.serviceWorker.controller||!worker)return;pendingWorker=worker;banner.style.display='block';banner.querySelector('#baba-update-now').disabled=false;banner.querySelector('#baba-update-now').textContent='Update Now'};
  banner.querySelector('#baba-update-now').addEventListener('click',()=>{
    if(!pendingWorker)return;
    // Existing progress is stored in localStorage and is not touched by service-worker caches.
    banner.querySelector('#baba-update-now').disabled=true;
    banner.querySelector('#baba-update-now').textContent='Updating…';
    pendingWorker.postMessage({type:'SKIP_WAITING'});
  });
  banner.querySelector('#baba-update-later').addEventListener('click',()=>{banner.style.display='none'});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    const checkWaiting=()=>{if(reg.waiting)show(reg.waiting)};
    checkWaiting();
    reg.addEventListener('updatefound',()=>{
      const worker=reg.installing;
      if(!worker)return;
      worker.addEventListener('statechange',()=>{if(worker.state==='installed')checkWaiting()});
    });
    const check=()=>{if(navigator.onLine)reg.update().then(checkWaiting).catch(()=>{})};
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
    window.addEventListener('online',check);
    setInterval(()=>{if(!document.hidden)check()},60*60*1000);
    check();
  }).catch(()=>{});
})();
</script></body></html>
